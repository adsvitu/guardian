name: Guardian - EcoRenovar (Google Ads)

on:
  schedule:
    # Seg, Qua e Sex às 08h de Brasília (11h UTC)
    - cron: '0 11 * * 1,3,5'
  workflow_dispatch:

# Força Node.js 24 em todas as actions (fix para deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          cd google_ads/ecorenovar
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnóstico de Ambiente
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          echo "--- Verificando Secrets ---"
          if [ -z "$GOOGLE_ADS_YAML" ]; then echo "❌ GOOGLE_ADS_YAML está VAZIO!"; else echo "✅ GOOGLE_ADS_YAML carregado ($(echo $GOOGLE_ADS_YAML | wc -c) chars)"; fi
          if [ -z "$N8N_WEBHOOK_URL" ]; then echo "❌ N8N_WEBHOOK_URL está VAZIO! Vai usar o fallback hardcoded."; else echo "✅ N8N_WEBHOOK_URL: $N8N_WEBHOOK_URL"; fi
          echo "--- Testando conectividade com o webhook ---"
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" "$N8N_WEBHOOK_URL" || echo "Webhook offline ou URL inválida"

      - name: Rodar Guardião Ecorenovar
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          cd google_ads/ecorenovar
          python main.py
